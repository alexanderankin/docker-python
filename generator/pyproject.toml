[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-python-generator"
version = "0.4.0" # x-release-please-version
requires-python = ">=3.11"
dependencies = [
    'docker-python-core==0.4.0', # x-release-please-version
    'PyYAML>=6',
]

[dependency-groups]
test = ["pytest>=8.0", "pytest-cov"]
lint = ["ruff"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
docker-python-core = { path = "../core", editable = true }

[tool.setuptools.package-data]
docker_python_generator = ["customizations.toml"]

[tool.ruff]
line-length = 120
