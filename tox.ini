[tox]
requires = tox>=4
env_list = py311, py312, py313, py314

[testenv]
description = Run unit tests on {base_python}
package = skip
deps =
    pytest>=8
    -e {tox_root}/core
    -e {tox_root}/generator
    -e {tox_root}/docker-python-requests
    -e {tox_root}/versions/v1.40
    -e {tox_root}/versions/v1.44
    -e {tox_root}/versions/v1.55
    -e {tox_root}/examples
commands_pre =
    python -m docker_python_generator {tox_root}/docker-engine-api-specs/v1.40.yaml {tox_root}/versions/v1.40
    python -m docker_python_generator {tox_root}/docker-engine-api-specs/v1.44.yaml {tox_root}/versions/v1.44
    python -m docker_python_generator {tox_root}/docker-engine-api-specs/v1.55.yaml {tox_root}/versions/v1.55
commands =
    python -m pytest --durations=10 {posargs}
