defaults:
  run:
    shell: bash

on:
  pull_request:
    branches: &branches
      - main
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches: *branches

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python_version:
          - 3.13
          - 3.14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python_version }}"
      - uses: actions/cache@v4
        id: cache-venv
        with: &cache-venv
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python_version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-
      - if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install ./core/; pip install --group ./core/pyproject.toml:dev
          python -c "import docker_python.core"
          pip install ./generator/; pip install --group ./generator/pyproject.toml:dev
          python -c "import docker_python_generator"
          pip install ./docker-python-requests/; pip install --group ./docker-python-requests/pyproject.toml:dev
          python -c "import docker_python.transports.requests"
          python -m docker_python_generator ./docker-engine-api-specs/v1.40.yaml ./versions/v1.40
          python -m docker_python_generator ./docker-engine-api-specs/v1.44.yaml ./versions/v1.44
          python -m docker_python_generator ./docker-engine-api-specs/v1.55.yaml ./versions/v1.55
          pip install ./versions/v1.40/; pip install --group ./versions/v1.40/pyproject.toml:dev
          python -c "import docker_python.versions.v_1_40"
          pip install ./versions/v1.44/; pip install --group ./versions/v1.44/pyproject.toml:dev
          python -c "import docker_python.versions.v_1_44"
          pip install ./versions/v1.55/; pip install --group ./versions/v1.55/pyproject.toml:dev
          python -c "import docker_python.versions.v_1_55"
          pip install ./examples/; pip install --group ./examples/pyproject.toml:dev
          python -c "import docker_python_examples"
      - run: |
          source .venv/bin/activate
          # generator "itest":
          python -m docker_python_generator ./docker-engine-api-specs/v1.40.yaml ./versions/v1.40
          python -m docker_python_generator ./docker-engine-api-specs/v1.44.yaml ./versions/v1.44
          python -m docker_python_generator ./docker-engine-api-specs/v1.55.yaml ./versions/v1.55
          (cd core; pytest || [ $? -eq 5 ])
          (cd generator; pytest || [ $? -eq 5 ])
          (cd docker-python-requests; pytest || [ $? -eq 5 ])
          (cd examples; pytest || [ $? -eq 5 ])

  release_please:
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: "${{ steps.release.outputs.release_created }}"
      tag_name: "${{ steps.release.outputs.tag_name }}"
    concurrency:
      group: release-please
      cancel-in-progress: false
    steps:
      # - uses: actions/create-github-app-token@v3
      #   id: app-token
      #   with:
      #     client-id: ${{ secrets.BOT_CLIENT_ID }}
      #     private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # token: ${{ steps.app-token.outputs.token }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
  publish:
    needs:
      - build
      - release_please
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - uses: actions/cache@v4
        id: cache-venv
        with: *cache-venv
      - run: . .venv/bin/activate; pip install --upgrade pip build
      - run: |
          . .venv/bin/activate
          mkdir -p dist
          python -m build ./core/ --wheel -o ./dist
          python -m build ./docker-python-requests/ --wheel -o ./dist
          python -m build ./versions/v1.40/ --wheel -o ./dist
          python -m build ./versions/v1.44/ --wheel -o ./dist
          python -m build ./versions/v1.55/ --wheel -o ./dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          fail_on_unmatched_files: true
