[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-python-requests"
version = "0.4.0" # x-release-please-version
requires-python = ">=3.11"
dependencies = [
    'docker-python-core==0.4.0', # x-release-please-version
    'requests>=2.31',
    'urllib3>=2.0',
    'requests-unixsocket>=0.4',
    'typing-extensions>=4',
    'pywin32>=306; sys_platform == "win32"',
    'types-pywin32>=306; sys_platform == "win32"',
]

[dependency-groups]
test = ["pytest>=8.0", "pytest-cov"]
lint = ["ruff", "ty"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.setuptools.packages.find]
where = ["src"]
include = ["docker_python.*"]
namespaces = true
