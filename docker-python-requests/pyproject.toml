[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-python-requests"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ['docker-python-core==0.1.0', 'requests>=2.31', 'requests-unixsocket>=0.4']

[tool.setuptools.packages.find]
where = ["src"]
include = ["docker_python.*"]
namespaces = true
